[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trustleash"
version = "0.1.0"
description = "Forensic audits for AI coding agents — catches agents that narrate work they never did."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
trustleash = "trustleash.__main__:main"

[tool.setuptools.packages.find]
include = ["trustleash*"]
